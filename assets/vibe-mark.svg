<svg xmlns="http://www.w3.org/2000/svg" viewBox="-11.925 -44.06 265 265" width="265" height="265" fill="#FFFFFF" fill-rule="nonzero" role="img" aria-label="Vibe Energy">
  <title>Vibe Energy</title>
  <!-- Het V-beeldmerk uit de horizontale master assets/vibe-energy-logo.svg,
       groep #mark-v. De twee paden zijn teken voor teken overgenomen: geen
       nieuwe ankerpunten, geen gewijzigde hoeken, geen transform. De viewBox is
       verlegd zodat de V vrij staat op een vierkant vlak, en de fill is wit
       (#FFFFFF) in plaats van het donkere #171A1B van de master.
       Gemeten bounding box van de V: x 0, y 0, breedte 241,15, hoogte 176,88.
       Vierkant canvas 265 met de V optisch gecentreerd:
         min-x = -(265 - 241,15) / 2 = -11,925
         min-y = -(265 - 176,88) / 2 = -44,06 -->
  <g id="mark-v">
    <path id="v-left" d="M 0 0 L 39.87 0 A 11.01 11.01 0 0 1 49.28 5.29 L 104.21 95.64 L 80.78 132.85 Z"/>
    <path id="v-right" d="M 191.85 5.14 A 11.01 11.01 0 0 1 201.16 0 L 241.15 0 L 133 171.74 A 11.01 11.01 0 0 1 123.68 176.88 L 83.7 176.88 Z"/>
  </g>
</svg>
