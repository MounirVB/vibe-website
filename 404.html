<style>
  :root{--bg:#06121A;--paper:#EAF1F6;--soft:rgba(234,241,246,.62);--mute:rgba(234,241,246,.4);--signal:#00ADEF;--line:rgba(255,255,255,.1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--paper);font-family:'IBM Plex Sans',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:radial-gradient(900px 600px at 78% -10%,rgba(0,173,239,.12),transparent 60%)}
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 24px 80px}
  .code{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(96px,22vw,220px);letter-spacing:-.05em;line-height:.9;

  .eyb{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--signal);margin-bottom:10px;display:flex;align-items:center;gap:12px}

  .actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:34px}
  .btn{display:inline-flex;align-items:center;gap:12px;padding:14px 24px;font-family:'IBM Plex Sans';font-weight:400;font-size:15px;text-decoration:none;border-radius:3px;transition:.2s}
  .btn-p{background:var(--paper);color:#06121C}
  .btn-p:hover{transform:translateY(-1px)}
  .btn-s{border:1px solid var(--line);color:var(--paper)}
  .btn-s:hover{border-color:rgba(255,255,255,.4)}
  .links{margin-top:40px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--mute);display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center}
