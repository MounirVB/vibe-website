# ============================================================
#  ANALYTICS-INGEST — Cloud Run Job
#  ------------------------------------------------------------
#  NIET UITGEROLD. Dit is een manifest, geen draaiende dienst.
#  Toepassen maakt billbare resources aan en vraagt dus goedkeuring.
#
#  ------------------------------------------------------------
#  EN HET DIENSTACCOUNT HIERONDER BESTAAT NIET. GEMETEN OP
#  1 NOVEMBER 2026 met `gcloud iam service-accounts list
#  --project=vibe-energy-509410`: het project bevat PRECIES EEN
#  dienstaccount, en dat is
#  intel-backup-schrijver@vibe-energy-509410.iam.gserviceaccount.com
#  ("Vibe Intelligence back-upschrijver").
#
#  `vibe-analytics-ingest` is dus nooit aangemaakt; het is een naam uit
#  dit manifest en uit docs/R2-GSC-TOEGANG.md, en die naam werd
#  vervolgens in latere documenten herhaald alsof het account bestond.
#  De `gcloud`-regels onderaan dit bestand zijn de instructies om hem
#  AAN TE MAKEN -- ze zijn nooit uitgevoerd.
#
#  WAT ER IN PLAATS DAARVAN DRAAIT: de GSC-synchronisatie loopt sinds
#  1 november 2026 op RAILWAY, als dagelijkse plannertaak `gsc`
#  (prioriteit 94) met src/analytics/gsc.ts. Die gebruikt het BESTAANDE
#  back-upschrijver-account via INTEL_GCS_SLEUTEL, met uitsluitend de
#  scope webmasters.readonly. Er is dus geen nieuw account en geen
#  nieuwe sleutel voor nodig.
#
#  Dit manifest blijft staan als het ALTERNATIEVE pad, voor als de
#  langlevende sleutel op Railway ooit onacceptabel wordt. Wie het
#  toepast, maakt eerst het account aan met de regels onderaan.
#
#  WAAROM CLOUD RUN EN NIET RAILWAY
#  Gemeten in het zusterplatform en opnieuw bevestigd hier: Railway
#  heeft geen OIDC-identity-token en geen tokenendpoint. Workload
#  identity federation kan daar dus niet, en dan blijft alleen een
#  LANGLEVENDE service-accountsleutel over. Die sleutel zou in een
#  omgevingsvariabele staan van een dienst die uit een PUBLIEKE
#  repository bouwt.
#
#  Cloud Run draait met een service-identiteit. Er is geen sleutel,
#  geen JSON-bestand en niets om te lekken of te rouleren: de
#  container vraagt zijn token bij de metadataserver op.
#
#  WAT DEZE JOB WEL EN NIET MAG
#  De job leest Search Console en GA4 en schrijft naar de
#  intelligencedatabase. Hij publiceert niets, hij beslist niets en
#  hij raakt de website niet aan. Faalt hij, dan blijft elke
#  funnelstap ONBEKEND — en ONBEKEND is geen nul.
#
#  GEMETEN STAND VAN HET GCP-PROJECT — BIJGEWERKT 1 NOVEMBER 2026
#    project          vibe-energy-509410 ("Vibe Energy Calender")
#    rol van operator roles/owner
#    service accounts 1  (intel-backup-schrijver, was 0 op 10 okt)
#    searchconsole.googleapis.com       INGESCHAKELD  <- veranderd
#    storage.googleapis.com             ingeschakeld
#    bigquerystorage.googleapis.com     ingeschakeld
#    run.googleapis.com                 NIET ingeschakeld
#    analyticsdata.googleapis.com       NIET ingeschakeld
#    secretmanager.googleapis.com       NIET ingeschakeld
#    artifactregistry.googleapis.com    NIET ingeschakeld
#
#  De stand van 10 oktober zei '0 service accounts' en
#  'searchconsole NIET ingeschakeld'. Beide zijn achterhaald, en dat
#  is precies het soort verouderd feit dat een volgende ronde als
#  uitgangspunt overneemt.
#
#  Voor de CLOUD RUN-keten is er nog niets aanwezig: run,
#  artifactregistry en secretmanager staan uit. De commando's onderaan
#  maken hem aan; elk daarvan is een billbare of
#  configuratiewijzigende handeling.
# ============================================================

apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: vibe-analytics-ingest
  labels:
    applicatie: vibe-energy-intelligence
    onderdeel: analytics-ingest
  annotations:
    # Geen publieke toegang: een job wordt aangeroepen, niet bezocht.
    run.googleapis.com/launch-stage: GA
spec:
  template:
    spec:
      # Geen parallelliteit: de ingest is incrementeel en moet per
      # property in volgorde lopen, anders botsen twee runs op dezelfde
      # dagrij.
      parallelism: 1
      taskCount: 1
      template:
        spec:
          # Een eigen service-identiteit. GEEN sleutel: de container
          # haalt zijn token bij de metadataserver.
          serviceAccountName: vibe-analytics-ingest@vibe-energy-509410.iam.gserviceaccount.com
          maxRetries: 2
          timeoutSeconds: 900
          containers:
            - image: europe-west4-docker.pkg.dev/vibe-energy-509410/vibe/analytics-ingest:PLAATSHOUDER
              command: ["node"]
              # DE VLAG --ingest BESTAAT NIET, en dat was een stil defect.
              # Gemeten: de string 'ingest' komt NUL keer voor in
              # src/cli/analytics.ts. De CLI negeert een onbekende vlag,
              # dus deze job zou dagelijks GROEN draaien en alleen het
              # rapport printen — zonder iets te ingesteren. Dat is erger
              # dan een rode job.
              #
              # Nu de vlaggen die de CLI WEL kent (cli/analytics.ts):
              #   --meet    de eigen live-meting per URL
              #   --alles   over het hele pagina-register in plaats van 12
              #   --bewaar  de dagstand wegschrijven naar
              #             intel.indexatie_dagstand
              #
              # LET OP: --meet meet BEREIKBAARHEID van onze eigen site, en
              # geen indexatie door een zoekmachine. Dat laatste blijft
              # NOT_AVAILABLE tot Search Console is aangesloten; zie
              # bewaakScheiding() in analytics/koppelingen.ts.
              #
              # EN DEZE JOB IS NIET UITGEROLD. Sinds 1 november doet de
              # Railway-planner de taaksoort `indexatie` dagelijks, mét de
              # live-meting erin (src/kern/taken.ts). Dit manifest is
              # daarmee een alternatieve route en geen voorwaarde.
              args: ["src/cli/analytics.ts", "--meet", "--alles", "--bewaar"]
              resources:
                limits:
                  # Gemeten uitgangspunt: de ingest is IO-gebonden, niet
                  # rekenintensief. 512Mi en 1 vCPU is ruim; verhogen
                  # alleen op een meting, niet op een vermoeden.
                  cpu: "1"
                  memory: 512Mi
              env:
                - name: INTEL_OMGEVING
                  value: productie
                - name: INTEL_ORGANISATIE
                  value: vibe-energy
                - name: INTEL_SITE_BASIS_URL
                  value: https://www.vibeenergy.nl

                # De GSC-property. LET OP: dit is de Vibe ENERGY-property.
                # Vibe Home gebruikt GTM-WFWS7DRN en een eigen property;
                # die twee mogen nooit in dezelfde database belanden.
                #
                # GECORRIGEERD OP 1 NOVEMBER 2026. Hier stond
                # 'https://www.vibeenergy.nl/', een URL-prefixproperty.
                # De eigenaar heeft de bestaande property bevestigd en
                # dat is een DOMEINproperty: sc-domain:vibeenergy.nl.
                # Die twee meten verschillende dingen -- een
                # domeinproperty dekt apex en www plus http en https --
                # en de API eist de identiteit letterlijk in de
                # sc-domain:-vorm. De oude waarde zou dus 403 of 404
                # hebben gegeven op een property die wel bestaat, en dat
                # leest als 'geen data' in plaats van 'verkeerde
                # identiteit'.
                - name: INTEL_GSC_SITE_URL
                  value: sc-domain:vibeenergy.nl

                # De databaseverbinding komt uit Secret Manager en staat
                # NIET in dit bestand. Dit bestand staat in een publieke
                # repository.
                - name: INTEL_DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: vibe-intel-db-url
                      key: latest

                # GEEN INTEL_GSC_CLIENT_EMAIL en GEEN
                # INTEL_GSC_PRIVATE_KEY. Dat is het hele punt van
                # workload identity: de adapter haalt een
                # toegangstoken bij de metadataserver op met de
                # identiteit van de job. Er bestaat geen sleutel om te
                # lekken.
                # DEZE VARIABELE WORDT DOOR GEEN ENKELE REGEL CODE
                # GELEZEN, en dat is gemeten: de naam komt voor in dit
                # manifest en in vier markdownregels, en in nul
                # TypeScript-regels. src/kern/config.ts kent hem niet.
                #
                # Hij blijft staan omdat hij de BEDOELDE stroom
                # beschrijft, maar met dit voorbehoud erbij: zolang er
                # geen Search Console-adapter bestaat (geen googleapis,
                # geen google-auth in package.json; de enige
                # RS256-ondertekening in src/ is ops/gcsopslag.ts voor
                # Cloud STORAGE), suggereert een variabele die niemand
                # uitleest een werkende workload-identity-stroom die er
                # niet is. Wie de adapter bouwt, laat config.ts hem lezen
                # of haalt hem hier weg.
                - name: INTEL_GOOGLE_AUTH
                  value: workload-identity

                - name: INTEL_LOG_NIVEAU
                  value: info

---
# ============================================================
#  DE COMMANDO'S DIE DIT AANMAKEN
#  ------------------------------------------------------------
#  Elk van deze regels is een goedkeuringwaardige handeling: ze
#  schakelen betaalde API's in, maken een identiteit aan of geven
#  rechten weg. Ze staan hier als DOCUMENTATIE en zijn niet
#  uitgevoerd.
#
#  1. API's inschakelen (billbaar vanaf gebruik)
#
#     gcloud services enable \
#       run.googleapis.com \
#       artifactregistry.googleapis.com \
#       secretmanager.googleapis.com \
#       searchconsole.googleapis.com \
#       analyticsdata.googleapis.com \
#       --project vibe-energy-509410
#
#  2. De service-identiteit, zonder sleutel
#
#     gcloud iam service-accounts create vibe-analytics-ingest \
#       --display-name "Vibe analytics ingest" \
#       --project vibe-energy-509410
#
#     Let op: er wordt GEEN `gcloud iam service-accounts keys create`
#     gedaan. Dat zou precies de langlevende sleutel opleveren die
#     deze opzet vermijdt.
#
#  3. Rechten, zo smal mogelijk
#
#     gcloud secrets add-iam-policy-binding vibe-intel-db-url \
#       --member serviceAccount:vibe-analytics-ingest@vibe-energy-509410.iam.gserviceaccount.com \
#       --role roles/secretmanager.secretAccessor \
#       --project vibe-energy-509410
#
#  4. De Search Console-property delen
#
#     Dit kan NIET met gcloud. In Search Console wordt
#     vibe-analytics-ingest@vibe-energy-509410.iam.gserviceaccount.com
#     als gebruiker met leesrecht toegevoegd op de property
#     https://www.vibeenergy.nl/. Dat is een handmatige stap van
#     iemand die eigenaar van die property is.
#
#  5. In GA4 hetzelfde: het service-account als Viewer op de property
#     die bij VIBE ENERGY hoort. Nooit die van Vibe Home.
#
#  6. Plannen
#
#     gcloud scheduler jobs create http vibe-analytics-dagelijks \
#       --schedule "30 4 * * *" --time-zone Europe/Amsterdam \
#       --uri "https://europe-west4-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/vibe-energy-509410/jobs/vibe-analytics-ingest:run" \
#       --oauth-service-account-email vibe-analytics-ingest@vibe-energy-509410.iam.gserviceaccount.com \
#       --project vibe-energy-509410
#
#     04:30 Europe/Amsterdam: Search Console levert data met een
#     vertraging van enkele dagen, dus vroeg in de ochtend ophalen
#     geeft de meest complete dag zonder de API onnodig te belasten.
#
#  WAT ER DAARNA NOG MOET
#  De adapter in src/analytics/ kent op dit moment alleen de
#  variant met client_email en private_key. De workload-identityvariant
#  (token van de metadataserver) moet daar nog bij. Zolang dat niet
#  gebeurd is blijft de koppeling NIET AANGESLOTEN, en dat is wat
#  `npm run analytics` nu ook meldt.
# ============================================================
